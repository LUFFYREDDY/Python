<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Owner dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/owner.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <p class="kicker">Owner dashboard</p>
    <h1>Sign in</h1>
    <label class="field"><span>Username</span><input class="input" name="username" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
    <div id="loginMsg"></div>
    <button class="btn primary block" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="who" id="who"></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="tonight">Bookings</button>
      <button role="tab" data-tab="door">Door</button>
      <button role="tab" data-tab="floor">Floor plan</button>
      <button role="tab" data-tab="nights">Nights</button>
      <button role="tab" data-tab="brand">Branding &amp; policy</button>
      <button role="tab" data-tab="config">Venue config</button>
    </nav>
    <div class="top-actions">
      <a class="btn sm ghost" id="guestLink" target="_blank" rel="noopener">Booking page ↗</a>
      <button class="btn sm ghost" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main id="view"></main>
  <div class="savebar hidden" id="savebar" role="region" aria-label="Unsaved changes">
    <span id="saveMsg">Unsaved changes — guests still see the published version.</span>
    <button class="btn sm ghost" id="discard" type="button">Discard</button>
    <button class="btn sm primary" id="save" type="button">Save &amp; publish</button>
  </div>
</div>
<script type="module" src="/static/owner.js"></script>
</body>
</html>
